name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  build-and-test:
    name: Lint, Build, Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # 6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Restores the most recently saved CLI; the fetch step then reuses it or downloads a newer release.
      - name: Restore SAMM CLI cache
        id: samm-cli-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: .samm-cli
          key: samm-cli-${{ runner.os }}-${{ runner.arch }}-
          restore-keys: samm-cli-${{ runner.os }}-${{ runner.arch }}-

      # The only step with the token, so the test processes (VS Code, extension host, SAMM CLI) never see it.
      - name: Fetch SAMM CLI
        id: samm-cli
        run: |
          cli_path="$(node scripts/fetch-samm-cli.mjs)"
          if [[ "$cli_path" != "$PWD/.samm-cli/"*/* ]]; then
            echo "::error::Unexpected SAMM CLI path outside .samm-cli: $cli_path"
            exit 1
          fi
          tag="${cli_path#"$PWD/.samm-cli/"}"
          tag="${tag%%/*}"
          find .samm-cli -mindepth 1 -maxdepth 1 ! -name "$tag" -exec rm -rf {} +
          echo "SAMM_CLI_PATH=$cli_path" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          # Authenticates the SAMM CLI release lookup to avoid GitHub's unauthenticated API rate limit.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Save SAMM CLI cache
        if: steps.samm-cli-cache.outputs.cache-matched-key != format('samm-cli-{0}-{1}-{2}', runner.os, runner.arch, steps.samm-cli.outputs.tag)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: .samm-cli
          key: samm-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.samm-cli.outputs.tag }}

      - name: Test
        run: xvfb-run -a npm run test

      - name: Package VSIX
        run: npx @vscode/vsce package --out semantic-models-pr-${{ github.run_number }}.vsix

      - name: Upload packaged VSIX artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: semantic-models-vsix
          path: semantic-models-pr-${{ github.run_number }}.vsix
          if-no-files-found: error
